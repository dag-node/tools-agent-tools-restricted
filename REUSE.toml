# REUSE (https://reuse.software) licensing and copyright fallbacks.
#
# A file's own header, or an adjacent .license file, takes priority; these annotations supply the
# copyright and the licence a file does not state for itself, each independently. Within this file
# only the last matching annotation applies, so the broad path is listed first.

version = 1
SPDX-PackageName = "ai-tools"
SPDX-PackageDownloadLocation = "https://github.com/dag-node/tools-agent-tools-restricted"

# Default for the maintainer's own work.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Ondřej Nedomlel <tools@dagnode.com>"
SPDX-License-Identifier = "AGPL-3.0-only"

# The SELinux policy sources carry their own GPL-2.0-or-later headers; this entry covers what sits
# beside them without one -- the build Makefile and the draft -- and any module a local build leaves
# there (gitignored, never tracked: the RPM build compiles its own). A compiled module is GPL because
# it embeds macro expansions from the SELinux reference policy -- the reason the policy ships as its
# own ai-tools-selinux subpackage rather than inside the AGPL base.
[[annotations]]
path = "selinux/policy/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Ondřej Nedomlel <tools@dagnode.com>"
SPDX-License-Identifier = "GPL-2.0-or-later"

# assets/ holds generated images rather than authored work -- OpenAI's GPT-5.6 produced the README
# banner and Fable 5.1 optimized it -- so no human authorship stands behind the file, and the
# copyright the catch-all above would assert over it is doubtful in US and EU law alike. CC0 is
# correct either way: a public-domain dedication where no rights subsist, and a permissive grant
# through its Public License Fallback where some do. The maintainer is named as the affirmer because
# OpenAI's terms assign him "all right, title and interest, if any" in the output, which is what a
# dedication waives. Nothing under assets/ ships: the tarball's CONTENT list and the spec both leave
# it out, so this covers the repository alone.
[[annotations]]
path = "assets/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Ondřej Nedomlel <tools@dagnode.com>"
SPDX-License-Identifier = "CC0-1.0"
