# ai-tools integration manifest: dotnet (shipped by ai-tools-integration-dotnet).
# Parsed, never sourced, by providers.lib.sh. Its session-env fragment is
# session-env.d/dotnet.env.sh, which ai-tools-run sources when this integration is enabled.
# default_enable=no: dotnet widens host surface (a new runtime exec, NuGet egress, a writable
# cache), so it stays OFF until an operator names it in operator.conf AI_TOOLS_INTEGRATIONS.
default_enable=no
