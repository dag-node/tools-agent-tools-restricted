# ai-tools integration manifest: dotnet, shipped by ai-tools-integration-dotnet.
# What the sandbox tooling needs to know about the host .NET toolchain: whether a session gets
# it by default, its ai-tools-admin command domain, its build-output layout, and the SELinux
# policy it uses. Package data: read as KEY=value lines, not executed, and not edited on a host.
# Every key is described in ai-tools-providers(5).
default_enable=no
admin_summary=the .NET toolchain: its sandbox state and shared tools
build_output_dirs=bin obj artifacts
selinux_layout_module=ai_tools_dotnet
selinux_groups=tmpmap apphost localipc buildexec
