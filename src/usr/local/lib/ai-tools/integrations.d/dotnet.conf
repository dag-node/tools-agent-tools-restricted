# ai-tools integration manifest: dotnet, shipped by ai-tools-integration-dotnet.
# What the sandbox tooling needs to know about the host .NET toolchain: whether a session gets
# it by default, its ai-tools-admin command domain, its build-output layout, the files its build
# reads from above a project, and the SELinux policy it uses. Package data: read as KEY=value
# lines, not executed, and not edited on a host.
# Every key is described in ai-tools-providers(5).
default_enable=no
admin_summary=the .NET toolchain: its sandbox state and shared tools
build_output_dirs=bin obj artifacts
project_markers=*.sln *.slnf *.csproj *.fsproj *.vbproj
ancestor_config_files=.editorconfig Directory.Build.props Directory.Packages.props global.json NuGet.config
selinux_layout_module=ai_tools_dotnet
selinux_groups=tmpmap memfdexec localipc buildexec
