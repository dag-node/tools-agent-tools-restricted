# ai-tools agent manifest: codex, shipped by ai-tools-agents-codex-restricted.
# What the sandbox tooling needs to know about this agent: the package to install, the command
# that starts it, the executable inside that package the launcher is re-linked at, where it keeps
# its state and reads the shared orientation text, and the binary the SELinux confinement keys on.
# Package data: read as KEY=value lines, not executed, and not edited on a host. Every key is
# described in ai-tools-providers(5).
npm_package=@openai/codex
launcher=codex
launcher_target=lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex
display_name=Codex
handback=none
config_dir=.codex
memory_file=AGENTS.md
entrypoint_fcontext=/opt/ai-tools/\.nvm/versions/node/[^/]+/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex
default_enable=no
