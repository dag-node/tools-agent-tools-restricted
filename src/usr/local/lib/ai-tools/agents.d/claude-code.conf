# ai-tools agent manifest: claude-code (shipped by ai-tools-agents-claude-code-restricted).
# Parsed, never sourced, by providers.lib.sh -- the toolchain layer reads these to know which
# npm package to install and which launcher to symlink, and ai-tools-run reads the launcher to
# decide which executables may start a session, so neither hardcodes an agent.
# KEY=value per line; see /usr/local/lib/ai-tools/providers.lib.sh for the grammar and the
# fail-closed enablement rules (operator.conf AI_TOOLS_AGENTS).
npm_package=@anthropic-ai/claude-code
launcher=claude
display_name=Claude Code
# Ownership handback is driven by this agent's own PostToolUse/Stop/SessionStart/SessionEnd
# hooks (settings.json), which converge the project tree per turn, so ai-tools-run does not add a
# session-end sweep of its own. Any other value -- including an absent key -- makes the shim
# sweep instead, which is the safe direction: a redundant walk, never a tree left sandbox-owned.
handback=hooks
# This agent's control-plane directory, one component under the sandbox home
# (/opt/ai-tools/.claude). The agent package owns it and the files in it -- settings.json and the
# hooks -- while the base pins its mode and SELinux label (control-plane.lib.sh), so a second
# agent brings its own directory instead of sharing this one. The name must match the config
# directory this agent's session-env fragment pins (CLAUDE_CONFIG_DIR).
config_dir=.claude
# Where this agent reads skills, relative to its config directory. The shared skills in
# /opt/ai-tools/skills are symlinked in here, one per skill, so a skill is authored and updated
# in one place however many agents read it; a real directory placed here (an agent-specific or
# operator-authored skill) is never displaced by a link. An agent that cannot read the SKILL.md
# format leaves skills_dir unset, and is given no links.
skills_dir=skills
# Where this agent reads SUBAGENT definitions (its own delegate roles), relative to its config
# directory. Claude Code calls them "agents", which is the word this project uses for a packaged
# coding assistant like this one -- so the manifest maps our name onto its layout, and the shared
# definitions in /opt/ai-tools/subagents are symlinked in here the same way skills are.
subagents_dir=agents
# The binary the SELinux domain transition keys on: it must carry ai_tools_exec_t or a session
# would run unconfined. The stable and versioned "claude" links both resolve to this ELF, so it
# is the entrypoint, not the launcher name. A file-context regex ([^/]+ spans the Node version
# directory), applied as a local rule by ai-tools-relabel-agent -- the base policy is agent-agnostic
# here. The TYPE is not declared here: relabel.lib.sh pins ai_tools_exec_t, and the pattern is
# accepted only under the sandbox toolchain root.
entrypoint_fcontext=/opt/ai-tools/\.nvm/versions/node/[^/]+/lib/node_modules/@anthropic-ai/claude-code/bin/claude\.exe
# Provisioned by default when operator.conf omits an explicit AI_TOOLS_AGENTS set: Claude Code
# is the baseline agent this project ships, and it leaves host surface unchanged beyond the sandbox.
default_enable=yes
# Release provenance: where Anthropic publishes the per-release SHA-256 of every platform binary,
# the key that signs it, and that key's fingerprint. entrypoint-verify.lib.sh reads these to prove
# the installed entrypoint is the binary the vendor published; the three fields, and why the key is
# shipped here rather than fetched, are in providers.rule.md.
# The {version} slot takes the installed package version.
release_manifest_url=https://downloads.claude.ai/claude-code-releases/{version}/manifest.json
# Published at https://downloads.claude.ai/keys/claude-code.asc.
release_key=/usr/local/lib/ai-tools/keys/claude-code.asc
# A list: a key rotation declares both fingerprints for the overlap.
release_fingerprint=31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE
