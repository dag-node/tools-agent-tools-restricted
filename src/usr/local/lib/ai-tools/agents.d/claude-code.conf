# ai-tools agent manifest: claude-code (shipped by ai-tools-agents-claude-code-restricted).
# Parsed, never sourced, by providers.lib.sh -- the toolchain layer reads these to know which
# npm package to install and which launcher to symlink, and ai-tools-run reads the launcher to
# decide which executables may start a session, so neither hardcodes an agent.
# KEY=value per line; see /usr/local/lib/ai-tools/providers.lib.sh for the grammar and the
# fail-closed enablement rules (operator.conf AI_TOOLS_AGENTS).
npm_package=@anthropic-ai/claude-code
launcher=claude
display_name=Claude Code
# Ownership handback is driven by this agent's own PostToolUse/Stop/SessionStart/SessionEnd
# hooks (settings.json), which converge the project tree per turn, so ai-tools-run adds no
# session-end sweep of its own. Any other value -- including an absent key -- makes the shim
# sweep instead, which is the safe direction: a redundant walk, never a tree left sandbox-owned.
handback=hooks
# This agent's control-plane directory, one component under the sandbox home
# (/opt/ai-tools/.claude). The agent package owns it and the files in it -- settings.json and the
# hooks -- while the base pins its mode and SELinux label (control-plane.lib.sh), so a second
# agent brings its own directory instead of sharing this one. The name must match the config
# directory this agent's session-env fragment pins (CLAUDE_CONFIG_DIR).
config_dir=.claude
# The binary the SELinux domain transition keys on: it must carry ai_tools_exec_t or a session
# would run unconfined. The stable and versioned "claude" links both resolve to this ELF, so it
# is the entrypoint, not the launcher name. A file-context regex ([^/]+ spans the Node version
# directory), applied as a local rule by ai-tools-relabel-agent -- the base policy names no
# agent. The TYPE is not declared here: relabel.lib.sh pins ai_tools_exec_t, and the pattern is
# accepted only under the sandbox toolchain root.
entrypoint_fcontext=/opt/ai-tools/\.nvm/versions/node/[^/]+/lib/node_modules/@anthropic-ai/claude-code/bin/claude\.exe
# Provisioned by default when operator.conf names no explicit AI_TOOLS_AGENTS set: Claude Code
# is the baseline agent this project ships, and it widens no host surface beyond the sandbox.
default_enable=yes
