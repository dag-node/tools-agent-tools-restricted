# ai-tools agent manifest: claude-code, shipped by ai-tools-agents-claude-code-restricted.
# What the sandbox tooling needs to know about this agent: the package to install, the command
# that starts it, where it keeps its state and reads the shared assets, the binary the SELinux
# confinement keys on, and where its releases are verified. Package data: read as KEY=value
# lines, not executed, and not edited on a host. Every key is described in ai-tools-providers(5).
npm_package=@anthropic-ai/claude-code
launcher=claude
display_name=Claude Code
handback=hooks
config_dir=.claude
skills_dir=skills
subagents_dir=agents
memory_file=CLAUDE.md
entrypoint_fcontext=/opt/ai-tools/\.nvm/versions/node/[^/]+/lib/node_modules/@anthropic-ai/claude-code/bin/claude\.exe
default_enable=yes
release_manifest_url=https://downloads.claude.ai/claude-code-releases/{version}/manifest.json
release_key=/usr/local/lib/ai-tools/keys/claude-code.asc
release_fingerprint=31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE
