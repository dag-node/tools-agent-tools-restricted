# ai-tools agent manifest: claude-code (shipped by ai-tools-agents-claude-code-restricted).
# Parsed, never sourced, by providers.lib.sh -- the toolchain layer reads these to know which
# npm package to install and which launcher to symlink, and ai-tools-run reads the launcher to
# decide which executables may start a session, so neither hardcodes an agent.
# KEY=value per line; see /usr/local/lib/ai-tools/providers.lib.sh for the grammar and the
# fail-closed enablement rules (operator.conf AI_TOOLS_AGENTS).
npm_pkg=@anthropic-ai/claude-code
launcher=claude
display_name=Claude Code
# Provisioned by default when operator.conf names no explicit AI_TOOLS_AGENTS set: Claude Code
# is the baseline agent this project ships, and it widens no host surface beyond the sandbox.
default_enable=yes
