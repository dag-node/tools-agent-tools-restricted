# /etc/codex/managed_config.toml -- the defaults codex applies on every
# start, ahead of a user's own config.toml. Shipped by
# ai-tools-agents-codex-restricted as 0644 root:root and kept across an
# upgrade; a newer copy lands beside it as managed_config.toml.rpmnew.
#
# sandbox_mode names CODEX's own sandbox, not the host's. That sandbox
# is bubblewrap, which needs a user namespace the session unit refuses,
# so the mode codex labels YOLO in its banner turns codex's layer off
# and leaves the session confined the way a claude session is: by DAC,
# the ai_tools_t domain, and the unit's properties. requirements.toml
# beside this file is where the mode is pinned.
#
# What each key does, what an operator may change, and what a release
# that renames one costs: the Codex page in the shipped documentation
# and ai-tools-providers(5).
#
# Bare keys stay AHEAD OF the first table header: a bare key after one
# is that table's key and is ignored.
sandbox_mode = "danger-full-access"
approval_policy = "never"
check_for_update_on_startup = false

# Operator options, commented by default. Each is the codex counterpart
# of a claude-code operator.conf key. A file named here must be readable
# by the sandbox account, and the prompt file must sit under
# /etc/ai-tools/prompts, the one root the confined session reads.
#model_instructions_file = "/etc/ai-tools/prompts/codex-instructions.md"
#openai_base_url = "https://example.invalid/v1"

[agents]
enabled = false

# A session runs under a service account, on a terminal an operator may
# be reading over ssh or through a multiplexer. Motion and a bell are
# the two things that cost there rather than inform: animations redraw
# a line that carries no new state, and a notification reaches the
# operator's desktop from a session they did not start. Neither is
# a control -- an operator who wants them back sets either key in their
# own config.toml, and the managed file decides only the default.
[tui]
animations = false
notifications = false

[analytics]
enabled = false

[feedback]
enabled = false

[otel]
exporter = "none"
trace_exporter = "none"
metrics_exporter = "none"
log_user_prompt = false
