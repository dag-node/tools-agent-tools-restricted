# /etc/codex/managed_config.toml -- the defaults codex applies on every
# start, ahead of a user's own config.toml: the sandbox mode and the
# approval policy the requirements file pins, the update check off (the
# nvm-update timer maintains the toolchain), sub-agents off, and the
# telemetry opt-outs. Shipped by ai-tools-agents-codex-restricted as
# 0644 root:root and kept across an upgrade; a newer copy lands beside
# it as managed_config.toml.rpmnew.
#
# The keys were measured against codex-cli 0.154.0, and a release that
# takes other keys refuses to start: the remedy is editing this file,
# never a change to the host's boundary (see requirements.toml). The
# opt-outs are dispositional -- a release that reads other keys posts
# again -- and the session's confinement does not depend on them.
#
# Bare keys stay AHEAD OF the first table header: a bare key after one
# is that table's key and is ignored.
sandbox_mode = "danger-full-access"
approval_policy = "never"
check_for_update_on_startup = false

# Operator options, commented by default. Each is the codex counterpart
# of a claude-code operator.conf key. A file named here must be readable
# by the sandbox account, and the prompt file must sit under
# /etc/ai-tools/prompts, the one root the confined session reads.
#model_instructions_file = "/etc/ai-tools/prompts/codex-instructions.md"
#openai_base_url = "https://example.invalid/v1"

[agents]
enabled = false

[analytics]
enabled = false

[feedback]
enabled = false

[otel]
exporter = "none"
trace_exporter = "none"
metrics_exporter = "none"
log_user_prompt = false
