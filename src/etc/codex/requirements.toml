# /etc/codex/requirements.toml -- what codex enforces on every session
# the sandbox launches: the sandbox-mode pin, the approval policy, the
# login method, the hooks in its [hooks] table as the only hooks, and
# the destructive git verbs its [rules] table refuses.
# Shipped by ai-tools-agents-codex-restricted as 0644 root:root and
# kept across an upgrade; a newer copy lands beside it as
# requirements.toml.rpmnew.
#
# Nothing here holds a guarantee: the session runs as the sandbox
# account in the confined domain whatever codex reads. The pinned mode
# names CODEX's own sandbox -- bubblewrap, which needs a user namespace
# the session unit refuses -- so pinning full access turns that layer
# off and leaves the host's boundary standing, and read-only stays
# listed because codex refuses the list without it.
#
# What each key does, what an operator may change, and what a release
# that renames one costs: the Codex page in the shipped documentation
# and ai-tools-providers(5).
#
# Bare keys stay AHEAD OF the first table header: a bare key after one
# is that table's key and is ignored.
allowed_sandbox_modes = ["read-only", "danger-full-access"]
allowed_approval_policies = ["never"]
allowed_login_methods = ["chatgpt"]
allow_managed_hooks_only = true
default_permissions = ":danger-full-access"

[allowed_permission_profiles]
":danger-full-access" = true

[marketplaces]
restrict_to_allowed_sources = true

# The per-command refusals, and a gate rather than a boundary: what
# the session may reach is DAC and ai_tools_t. A requirements rule can
# only narrow -- its decision is "prompt" or "forbidden", never
# "allow", and the most restrictive rule that matches wins -- so the
# table holds the rows the host does not otherwise refuse: the git
# verbs that destroy with no undo, unprivileged, in the operator's own
# tree. The root-only commands the claude-code package also denies
# (sudo, systemctl, dnf, ...) are left out, since NoNewPrivileges and
# the confined domain refuse them already.
#
# A pattern is an exact prefix of the command's arguments, matched
# token by token, so `git push origin main --force` does not match the
# push rule. That is the reach claude-code's `git push --force*` has
# too: what the layer buys is that the habitual spelling reaches the
# operator rather than the shell.
#
# `git clean` is refused as a whole verb rather than by flag, the one
# row wider than claude-code's: its destructive spellings are one token
# each, and an enumeration leaks the one it misses. A dry run is what
# that costs, and `git status --porcelain` lists untracked files.
[[rules.prefix_rules]]
pattern = [
  { token = "git" },
  { token = "push" },
  { any_of = ["-f", "--force", "--force-with-lease", "--force-if-includes"] },
]
decision = "forbidden"
justification = "A force push overwrites the branch for every other clone: raise it, and the operator runs it"

[[rules.prefix_rules]]
pattern = [{ token = "git" }, { token = "reset" }, { token = "--hard" }]
decision = "forbidden"
justification = "A hard reset deletes uncommitted work: commit it, or `git stash`, or `git restore` one path"

[[rules.prefix_rules]]
pattern = [{ token = "git" }, { token = "clean" }]
decision = "forbidden"
justification = "git clean deletes untracked files no commit and no reflog can return: remove a path by name"

# The ownership handback's cadence. The shim's session-end sweep hands
# back whatever these miss; Stop is where the per-turn sweep runs, since
# SessionEnd is capped at 3 s whatever timeout is declared.
[hooks]
managed_dir = "/opt/ai-tools/.codex"

[[hooks.SessionStart]]
matcher = "startup|resume"
[[hooks.SessionStart.hooks]]
type = "command"
command = "/opt/ai-tools/.codex/session-hook.sh session-start"
timeout = 60

[[hooks.PostToolUse]]
matcher = ".*"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "/opt/ai-tools/.codex/post-tool-hook.sh"
timeout = 30

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "/opt/ai-tools/.codex/session-hook.sh"
timeout = 600

[[hooks.SessionEnd]]
[[hooks.SessionEnd.hooks]]
type = "command"
command = "/opt/ai-tools/.codex/session-hook.sh session-end"
timeout = 3
