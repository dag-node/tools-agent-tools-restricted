# /etc/ai-tools/endpoints/typesafe.conf -- the TypeSafe credential
# and endpoint the decide command of the typesafe integration reads.
# The command reads it at call time, in a session launched
# with `typesafe` named in AI_TOOLS_INTEGRATIONS (operator.conf).
# The key is required; while it is commented the command reports
# the file as not configured and does not print a result.
#
# Mode 640 root:ai-tools: TYPESAFE_API_KEY is a credential, so the file
# is not world-readable; edit it with sudo. Only the documented keys are
# read. Each option is stated in full in the manual page
# ai-tools-typesafe.conf(5).

# The API key TypeSafe issued. Required.
# Replace with your key from https://console.typesafe.ai/keys
#TYPESAFE_API_KEY=apikey_

# The model that answers. jev-latest follows each stable release; name
# a version, as jev-1.13.0, to keep the answers of one release.
TYPESAFE_MODEL=jev-latest

# The API origin, https with no path. Its host must equal
# TYPESAFE_ENDPOINT_HOST, or the command refuses to send the key.
TYPESAFE_BASE_URL=https://api.typesafe.ai
TYPESAFE_ENDPOINT_HOST=api.typesafe.ai

# The least P(true) that keeps a listing line, from 0 to 1.
#TYPESAFE_THRESHOLD=0.5

# The band of P(true) reported as uncertain, as low,high.
#TYPESAFE_UNCERTAIN_BAND=0.35,0.65

# One request attempt, in whole milliseconds from 1000 to 120000.
#TYPESAFE_TIMEOUT_MS=15000
