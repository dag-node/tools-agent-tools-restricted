# /etc/ai-tools/endpoints/custom-claude-endpoint.conf
#
# Custom API endpoint for sandboxed Claude Code sessions.
# Used only when operator.conf sets CLAUDE_BASE_URL_FILE to this path.
# Ships fully commented (inert) so the pointer alone changes nothing.
#
# Permissions: 640 root:ai-tools (contains credentials; edit with sudo).
# Only the four keys below are read. An invalid value aborts the launch.
# See ai-tools-custom-claude-endpoint.conf(5) for full details.

# Endpoint URL (required to enable). Localhost needs no token.
#ANTHROPIC_BASE_URL=https://chat.example.invalid

# Bearer token passed to Claude Code.
#ANTHROPIC_AUTH_TOKEN=replace-with-your-token

# Models the endpoint resolves (one token each).
#ANTHROPIC_MODEL=claude-sonnet-4-5-20250929
#ANTHROPIC_DEFAULT_HAIKU_MODEL=claude-haiku-4-5-20251001
