# /etc/ai-tools/endpoints/custom-claude-endpoint.conf -- a custom API
# endpoint for sandboxed Claude Code sessions. It is read only
# where operator.conf sets CLAUDE_BASE_URL_FILE to this path, and it
# ships inert, every option commented, so the pointer alone leaves every
# launch unchanged.
#
# Mode 640 root:ai-tools: ANTHROPIC_AUTH_TOKEN is a credential,
# so the file is not world-readable; edit it with sudo. Only the four
# keys below are read, and a set option that is invalid refuses
# the launch. Each option is stated in full in the manual page
# custom-claude-endpoint.conf(5).

# The endpoint, an http(s) URL. Required to enable the endpoint;
# a localhost URL does not need a token.
#ANTHROPIC_BASE_URL=https://chat.example.tld
# Bearer token for the endpoint, passed to Claude Code by name.
#ANTHROPIC_AUTH_TOKEN=replace-with-your-token
# Model labels the endpoint resolves, one token each.
#ANTHROPIC_MODEL=claude-sonnet-4-5-20250929
#ANTHROPIC_DEFAULT_HAIKU_MODEL=claude-haiku-4-5-20251001
