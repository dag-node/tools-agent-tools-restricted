# /etc/ai-tools/endpoints/custom-claude-endpoint.conf
# Custom API endpoint for sandboxed Claude Code sessions (Agent Tools Restricted).
#
# This file routes a session at a non-default Anthropic-compatible endpoint (a local proxy such as
# service-proxy-ollama, or a custom gateway). It is READ ONLY WHEN operator.conf uncomments
#   CLAUDE_BASE_URL_FILE=/etc/ai-tools/endpoints/custom-claude-endpoint.conf
# and it ships INERT (every option commented), so uncommenting the pointer alone changes nothing
# until you set at least ANTHROPIC_BASE_URL below.
#
# Mode: 640 root:ai-tools -- NOT world-readable, because ANTHROPIC_AUTH_TOKEN is a credential. Only
# root and the sandbox account read it; edit it with sudo. operator.conf never holds the token, only
# the pointer to this file.
#
# Parsed as KEY=value with the shared grammar (operator.conf(5)); only the four keys below are read,
# any other key is ignored. Each uncommented option is validated at launch, and an INVALID one
# REFUSES the launch rather than routing the session partially -- so a broken edit fails closed.
#
#   ANTHROPIC_BASE_URL             REQUIRED to enable the endpoint. An http(s) URL. A localhost URL
#                                  needs no token; a remote one without a token is warned about.
#   ANTHROPIC_AUTH_TOKEN           Bearer token for the endpoint. Passed to Claude Code by name, so
#                                  its value never appears on any process command line.
#   ANTHROPIC_MODEL                Model label the endpoint resolves (an opaque single token; with a
#                                  custom proxy these names are labels it maps to an underlying
#                                  model, not necessarily real Anthropic model ids).
#   ANTHROPIC_DEFAULT_HAIKU_MODEL  Label for the fast/background model.
#
# These are process environment variables. A Claude Code settings `env` block that sets the same
# name wins over them; /etc/claude-code/managed-settings.json is the authoritative, un-overridable
# host layer. The shipped settings set no ANTHROPIC_* key, so this file governs by default.
#
# Example (a custom proxy that resolves the labels to an underlying model):
#ANTHROPIC_BASE_URL=https://chat.customdomain.tld
#ANTHROPIC_AUTH_TOKEN=replace-with-your-token
#ANTHROPIC_MODEL=claude-sonnet-4-5-20250929
#ANTHROPIC_DEFAULT_HAIKU_MODEL=claude-haiku-4-5-20251001
