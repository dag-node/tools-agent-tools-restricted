# /etc/ai-tools/operator.conf -- host options for the ai-tools sandbox.
# One KEY=value per line, read as data by a parser that does not source
# it; a list is written [a, b], and [] is the empty list. The file stays
# root-owned and not group/other-writable, or every option falls back
# to its default. Each option names its Default: what the host does
# while the key is absent. A commented line is an example value. Each
# option is stated in full in the manual page ai-tools-operator.conf(5).

# The accounts enrolled as operators. Managed by the command
# `ai-tools-admin operators add|remove`; edit by hand only to review.
# Default: no account.
OPERATORS=[@PROJECTS_USER@]

# The agents the toolchain provisions: exactly the names listed.
# Default: no agent; `ai-tools-admin system bootstrap` asks which one
# and writes this line. Every agent named here runs as the one sandbox
# account and reads what the others store -- a login, a token, a session
# history -- so read ai-tools-operator.conf(5) before naming a second
# one.
#AI_TOOLS_AGENTS=[]

# The host-toolchain integrations a session receives: exactly the names
# listed. Default: the installed integrations whose package enables
# them by default; no integration this project ships does, so a session
# receives one only once it is named here.
#AI_TOOLS_INTEGRATIONS=[]

# The command-filter rule sets a session applies: exactly the names
# listed, so [] turns filtering off. Default: every installed set.
#AI_TOOLS_FILTERS=[core, dotnet]

# Refuse a launch where SELinux confinement is not verified active,
# instead of starting DAC-only. Default: no; such a launch proceeds.
#AI_TOOLS_REQUIRE_SELINUX=yes

# Refuse a launch of an entrypoint that carries no pin. Default: no;
# such a launch proceeds. Root pins either the checksum a vendor signed
# or, for a vendor publishing none, the binary as installed -- ai-tools
# status names which. A mismatch against either refuses at both
# settings.
#AI_TOOLS_REQUIRE_ENTRYPOINT_VERIFY=yes

# A custom system prompt for Claude Code sessions: a plain-text file,
# placed under /etc/ai-tools/prompts/. Default: Claude Code's own
# prompt, which an empty value keeps too.
#CLAUDE_SYSTEM_PROMPT_FILE=/etc/ai-tools/prompts/claude-system-prompt.md
# append layers the file after Claude Code's own prompt; replace drops
# that prompt. Default: append.
#CLAUDE_SYSTEM_PROMPT_MODE=append

# A custom API endpoint for Claude Code sessions: the URL and the token
# live in a 640 root:ai-tools file under /etc/ai-tools/endpoints/,
# and not in this world-readable file. The file's options are stated
# in ai-tools-custom-claude-endpoint.conf(5). Default: Claude Code's own
# endpoint.
#CLAUDE_BASE_URL_FILE=/etc/ai-tools/endpoints/custom-claude-endpoint.conf

# Directory names the helper walks skip, by category. A set key replaces
# that category's default, and [] skips none of it. Defaults:
#   SKIP_VCS_DIRS        [.git]
#   SKIP_PACKAGE_DIRS    [node_modules, .venv, packages]
#   SKIP_CACHE_DIRS      [__pycache__]
#   SKIP_ARTIFACT_DIRS   [], and [] for the paths excluded from it
#SKIP_VCS_DIRS=[.git]
#SKIP_PACKAGE_DIRS=[node_modules, .venv, packages]
#SKIP_ARTIFACT_DIRS=[bin, obj]
#SKIP_ARTIFACT_DIRS_EXCLUDED_PATHS_RELATIVE=[src/usr/local/bin, src/opt/ai-tools/bin]
#SKIP_CACHE_DIRS=[__pycache__]
