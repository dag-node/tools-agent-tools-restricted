# /etc/ai-tools/operator.conf -- ai-tools host configuration.
# Parsed line by line as KEY=value pairs, never sourced. Root-write-only, world-readable
# (carries no secrets). This file must stay root-owned and non-group/other-writable: the
# provider gating below ignores it otherwise and falls back to the built-in defaults.
#
# Grammar (one parser for every key -- /usr/local/lib/ai-tools/conf.lib.sh):
#   KEY=value            quotes optional; whitespace around the key and `=` is trimmed
#   KEY="a b"            one layer of matched quotes is stripped
#   KEY=a, b  c          list items separate on commas AND whitespace, freely mixed
#   KEY=value  # why     `#` at the start of a value, or after whitespace, begins a comment;
#                        inside quotes it is literal, so write KEY="a#b" to keep one
#   KEY=                 PRESENT but empty -- for a list key that means "none", which is
#                        different from omitting the key (see the per-key notes below)
# A repeated key takes its last assignment.

# The login users whose projects the sandbox works on. Managed in place by
# `ai-tools-admin operator add|remove`; read at runtime by the root helpers and the
# agent hooks (resolver: /usr/local/lib/ai-tools/operator.lib.sh).
OPERATORS="@PROJECTS_USER@"

# Which AI agents the toolchain provisions: ai-tools-bootstrap installs each enabled agent's
# npm package and the nvm-update timer keeps it current. Agent names, each matching an installed
# manifest /usr/local/lib/ai-tools/agents.d/<name>.conf (shipped by its ai-tools-agents-*
# package). When this key is ABSENT (the default) the baseline is provisioned: every installed
# agent whose manifest sets default_enable=yes (Claude Code today). Uncomment to pin an exact
# allowlist instead -- a PRESENT key lists exactly the agents to provision (empty = none), so a
# surface-widening agent stays off until you name it. Fail-closed: a listed name with no installed
# manifest is reported and skipped. See /usr/local/lib/ai-tools/providers.lib.sh.
#AI_TOOLS_AGENTS="claude-code"

# Which host-toolchain integrations a session enables (e.g. dotnet: DOTNET_ROOT, the shared NuGet
# cache, its tools dir on PATH). Names matching an installed manifest
# /usr/local/lib/ai-tools/integrations.d/<name>.conf (shipped by its ai-tools-integration-*
# package, which also drops the session-env fragment session-env.d/<name>.env.sh that ai-tools-run
# sources when enabled). Same fail-closed rules as AI_TOOLS_AGENTS: absent (the default) = the
# baseline (installed integrations with default_enable=yes); present = an exact allowlist.
# Surface-widening integrations such as dotnet ship default_enable=no, so they stay off until
# named here. See /usr/local/lib/ai-tools/providers.lib.sh.
#AI_TOOLS_INTEGRATIONS="dotnet"

# Which token-saving command-filter rule sets a session applies: an agent's filter hook rewrites a
# matching command so the tool itself prints less (git log to a one-line format, dotnet to quiet
# verbosity) and strips terminal control noise from what it prints. Names matching an installed
# /usr/local/lib/ai-tools/filters.d/<name>.rules -- "core" is the base's own set, and a package
# such as ai-tools-integration-dotnet ships its own. When this key is ABSENT (the default) every
# installed rule set applies. A PRESENT key lists exactly the sets to apply, so an EMPTY value
# turns filtering off entirely -- the switch to reach for when a session's command output looks
# unexpected. Filtering never decides what the agent may run: the permission rules in
# settings.json are re-evaluated on the rewritten command. See
# /usr/local/lib/ai-tools/filters.lib.sh.
#AI_TOOLS_FILTERS="core dotnet"

# Directory names omitted from the helper walks (handback sweeps, claim normalization,
# secret lockdown). A set key REPLACES that category's default. Full reference, defaults,
# and semantics: /usr/local/lib/ai-tools/skip-dirs.lib.sh.
# Defaults shown commented; SKIP_ARTIFACT_DIRS ships empty -- its line shows candidate
# values (a skipped tree is not handed back, so skip build output only where walking it
# is a real cost, and exempt any same-named source dir via the relative exclusions).
#SKIP_VCS_DIRS=".git"
#SKIP_PACKAGE_DIRS="node_modules .venv packages"
#SKIP_ARTIFACT_DIRS="bin obj"
#SKIP_ARTIFACT_DIRS_EXCLUDED_PATHS_RELATIVE="src/usr/local/bin src/opt/ai-tools/bin"
#SKIP_CACHE_DIRS="__pycache__"
