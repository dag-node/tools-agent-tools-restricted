# /etc/ai-tools/operator.conf -- host options for the ai-tools sandbox.
# One KEY=value per line, read as data by a parser that does not source
# it; a list is written [a, b], and [] is the empty list. The file stays
# root-owned and not group/other-writable, or every option falls back
# to its default. Each option states its Values and its Default:
# what the host does while the key is absent. A commented line is not
# read, whatever value it shows, so the key takes its Default. Each
# option is stated in full in the manual page ai-tools-operator.conf(5).

# The accounts enrolled as operators. Managed by the command
# `ai-tools-admin operators add|remove`; edit by hand only to review.
# Values: [account, ...]
# Default: no account
OPERATORS=[@PROJECTS_USER@]

# The agents the toolchain provisions: exactly the names listed, each
# written agent-<name> for an installed agent package;
# `ai-tools-admin system bootstrap` asks which one and writes this line.
# Every agent named here runs as the one sandbox account and reads
# what the others store -- a login, a token, a session history --
# so read ai-tools-operator.conf(5) before naming a second one.
# Values: [agent-<name>, ...]
# Default: no agent
#AI_TOOLS_AGENTS=[agent-claude-code]

# The host-toolchain integrations a session receives: exactly the names
# listed, each written integration-<name> for an installed integration
# package.
# Values: [integration-<name>, ...]
# Default: the installed integrations whose package enables them by default; no integration this project ships does
#AI_TOOLS_INTEGRATIONS=[integration-dotnet]

# The command-filter rule sets a session applies: exactly the names
# listed, each written filter-<name>; a set other than filter-base ships
# with its integration package.
# Values: [filter-<name>, ...], so [] turns filtering off
# Default: every installed set
#AI_TOOLS_FILTERS=[filter-base, filter-dotnet]

# Assets linked into every enabled agent, each <set>/<kind>/<name>;
# `ai-tools-admin assets enable` writes this line. A listed asset is
# linked once its set is installed, verified against a shipped binding
# and valid; `ai-tools-admin status` names each one that is not.
# The commented value names the core successors of the skills base
# seeded before 0.24.0.
# Values: [<set>/<kind>/<name>, ...]
# Default: no set asset
#AI_TOOLS_ASSETS=[core/skills/ai-tools-technical-writing, core/skills/ai-tools-reftags, core/skills/ai-tools-engineering-principles, core/skills/ai-tools-agent-governance, core/subagents/ai-tools-reference-docs-maintainer]

# Require verified SELinux confinement for a launch.
# yes: refuse a launch in each state where the launch check does not
#   show confinement -- SELinux permissive, the ai_tools policy
#   installed but not loaded, ai_tools_t a permissive domain, or
#   a Boolean AI_TOOLS_SELINUX_BOOLEANS lists at the other value.
#   A host with SELinux disabled, or without the ai_tools policy, still
#   launches DAC-only and warns.
# no: launch in each of those states without the SELinux layer, and
#   without a warning. A mislabelled agent binary is refused either way.
# Values: yes | no
# Default: yes
AI_TOOLS_REQUIRE_SELINUX=yes

# Required SELinux Boolean values while AI_TOOLS_REQUIRE_SELINUX=yes,
# each written as setsebool takes it. A listed Boolean at the other
# value, or an entry that is not <boolean>=on or <boolean>=off, refuses
# the launch. The list replaces the default, so [] requires none, and
# a Boolean it does not list is not required. ai-tools does not change
# a Boolean.
# Values: [<boolean>=on|off, ...]
# Default: [nis_enabled=off, domain_can_mmap_files=off, domain_can_write_kmsg=off]
AI_TOOLS_SELINUX_BOOLEANS=[nis_enabled=off, domain_can_mmap_files=off, domain_can_write_kmsg=off]

# Refuse a launch of an entrypoint that carries no pin. Root pins either
# the checksum a vendor signed or, for a vendor publishing none,
# the binary as installed -- ai-tools status names which. A mismatch
# against either refuses at both settings.
# Values: yes | no
# Default: no; such a launch proceeds
#AI_TOOLS_REQUIRE_ENTRYPOINT_VERIFY=yes

# A custom system prompt for Claude Code sessions: a plain-text file,
# placed under /etc/ai-tools/prompts/. Read by the claude-code agent
# alone.
# Values: a path under /etc/ai-tools/prompts/
# Default: empty; Claude Code's own prompt
#CLAUDE_SYSTEM_PROMPT_FILE=/etc/ai-tools/prompts/claude-system-prompt.md

# How CLAUDE_SYSTEM_PROMPT_FILE is applied: append layers the file
# after Claude Code's own prompt; replace drops that prompt.
# Values: append | replace
# Default: append
#CLAUDE_SYSTEM_PROMPT_MODE=append

# A custom API endpoint for Claude Code sessions: the URL and the token
# live in a 640 root:ai-tools file under /etc/ai-tools/endpoints/,
# and not in this world-readable file. Read by the claude-code agent
# alone; that file's options are
# in ai-tools-custom-claude-endpoint.conf(5).
# Values: a path under /etc/ai-tools/endpoints/
# Default: empty; Claude Code's own endpoint
#CLAUDE_BASE_URL_FILE=/etc/ai-tools/endpoints/custom-claude-endpoint.conf

# Directory names the helper walks skip, by category. A set key replaces
# that category's default, and [] skips none of it. The excluded paths
# are project-relative paths walked although their name is in
# SKIP_ARTIFACT_DIRS.
# Values: [name, ...] per category; [path, ...] for the excluded paths
# Default: [.git]
#SKIP_VCS_DIRS=[.git]
# Default: [node_modules, .venv, packages]
#SKIP_PACKAGE_DIRS=[node_modules, .venv, packages]
# Default: []
#SKIP_ARTIFACT_DIRS=[bin, obj]
# Default: []
#SKIP_ARTIFACT_DIRS_EXCLUDED_PATHS_RELATIVE=[src/usr/local/bin, src/opt/ai-tools/bin]
# Default: [__pycache__]
#SKIP_CACHE_DIRS=[__pycache__]
