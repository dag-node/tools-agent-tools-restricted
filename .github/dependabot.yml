# Keeps the GitHub Actions pins in .github/workflows/ current. No other ecosystems:
# this is a shell project with no package-manager dependency manifests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
