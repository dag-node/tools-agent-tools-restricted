name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
  # Manual trigger so the check jobs can be exercised from any branch (the podman/systemd
  # container path is runner-sensitive and should be testable without touching develop).
  # The release job runs on a tag alone and ignores it.
  workflow_dispatch:

# Least-privilege default for every job. shellcheck and rpm-selftest only read the repo;
# the release job re-grants contents: write for its own GITHUB_TOKEN needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag run: a re-tag (the documented recovery for a tag/VERSION
  # mismatch) must not cancel a release publish already in flight for that ref.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pin the version the repo's lint baseline is defined against
      # (.claude/rules/shellcheck.rule.md pins 0.10); ubuntu-latest's apt ships 0.9,
      # which reports a different finding set.
      - name: Install ShellCheck 0.10.0
        run: |
          set -euo pipefail
          ver=v0.10.0
          tarball="shellcheck-${ver}.linux.x86_64.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/${ver}/${tarball}"
          # Download to a FILE, never straight into tar. Piping curl into tar defeats
          # curl's `--retry`: a mid-transfer drop (curl error 56) has already streamed
          # truncated bytes into xz/tar ("File format not recognized"), and the retry
          # replays from the top into a stream the extractor has already consumed. To a
          # file, `--retry` re-fetches (and `-C -` resumes) cleanly. `-4` sidesteps the runner's
          # intermittently-broken IPv6 egress to the release CDN, the usual cause of the
          # repeated connection-died failures here.
          curl -4 -fL --no-progress-meter --connect-timeout 20 \
               --retry 5 --retry-delay 3 --retry-all-errors --retry-connrefused \
               -C - -o "${tarball}" "${url}"
          # Integrity-test the archive before trusting it, so a still-truncated download
          # fails here with a clear message instead of a cryptic error downstream in tar.
          # (Pinning a verified sha256 of the release asset is the recommended next step.)
          xz -t "${tarball}"
          tar -xJf "${tarball}"
          sudo install "shellcheck-${ver}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # Scope matches the documented baseline: src/**/*.sh plus install.sh. tests/,
      # selinux/, and packaging/ scripts are not part of that baseline; extend the scope
      # here and in the rule file together, after verifying each directory lints clean.
      - name: Lint the baseline against the repo's .shellcheckrc
        run: |
          find src -name '*.sh' -print0 | xargs -0 shellcheck
          shellcheck install.sh

  # The typesafe integration's decide command is vendored from a signed release of
  # dag-node/typesafe-client-js, whose own CI runs the command's suite. This job re-derives the
  # committed modules from that release: it downloads the tarball tools/generators/typesafe-client.pin
  # names, checks its signature and the tag's against the fingerprints the generator pins, and fails
  # unless every committed module matches the release. A module edited here, or a pin edited to match
  # it, fails this job; the offline half (tests/unit/typesafe.sh) sees only the first. The release job
  # needs this job.
  typesafe-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify the vendored decide command against its signed release
        run: bash tools/generators/typesafe-client.sh verify

  # Builds the RPMs and runs the full admin -> operator -> agent workflow (bootstrap,
  # operator enrolment, project claim, tests/run.sh all, a confined `claude --version`
  # session) inside a throwaway container of each served distribution with systemd as
  # PID 1. Mirrors `make -C packaging rpmtest-<distro>` -- see packaging/README.md for what
  # this does and does not cover (no SELinux-enforcing confinement; that still needs an
  # enforcing host, see the docs/rpm-packaging.md manual gate).
  #
  # One matrix arm per served distribution, each a release gate: the release job builds and
  # publishes exactly these dist tags, so every published package has passed this selftest on
  # its own distribution at the same commit. `distro` names the make target, `tag` the RPM
  # dist tag the image is named by (ai-tools-rpmbase:<tag>, the RPMs' .<tag>). Fedora is
  # pinned to the release its dist tag names (packaging/Makefile), so the arm is as stable a
  # target as the EL pair; the next Fedora is a new arm, as a new EL major is.
  #
  # Every push/PR run builds a dev/snapshot Release (see the comment on Release: in
  # packaging/ai-tools.spec) and uploads the resulting RPMs as a workflow artifact, so a
  # build off any commit is downloadable and inspectable without cutting a real release.
  #
  # OCI="sudo podman": the selftest container runs systemd as PID 1 plus the sandbox
  # account's own `systemd --user manager`, which needs full cgroup delegation; rootless
  # podman on hosted runners does not reliably provide that. The Makefile default stays
  # rootless `podman` for local runs.
  rpm-selftest:
    # Pinned, not ubuntu-latest: this job builds and runs podman containers, and the
    # apt podman/crun pair on the floating latest image can skew -- a newer podman emits an
    # OCI spec crun rejects with "unknown version specified" at container create, before any
    # build step runs. 22.04 is the known-good combo for this pipeline. The release job
    # pins for the same reason; the container-free shellcheck job stays on latest.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: rocky9,   tag: el9 }
          - { distro: rocky10,  tag: el10 }
          - { distro: fedora44, tag: fc44 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure podman, force the modern runc runtime, and report it
        run: |
          # The runner's podman (3.4.4) defaults to an ancient crun 0.17 (OCI spec 1.0.0) that
          # rejects the runtime spec podman generates -- "crun: unknown version specified" at
          # container create, before any build step runs. The same runner also ships a modern runc
          # (spec 1.2.1), so make runc the default OCI runtime for every podman call via a
          # containers.conf.d drop-in. The final `podman info` should report runtime=runc.
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }
          sudo mkdir -p /etc/containers/containers.conf.d
          printf '[engine]\nruntime = "runc"\n' | sudo tee /etc/containers/containers.conf.d/10-runc.conf
          sudo podman version || true
          runc --version 2>/dev/null || true
          sudo podman info --format 'runtime={{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Version}}' 2>/dev/null || true

      - name: Compute dev Release
        id: relver
        run: echo "release=0.${{ github.run_number }}.git$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: make -C packaging rpmtest-${{ matrix.distro }}
        run: make -C packaging rpmtest-${{ matrix.distro }} RPM_RELEASE=${{ steps.relver.outputs.release }} OCI="sudo podman"

      # `if: always()` so a failed selftest still surfaces the RPMs that caused it --
      # those are exactly the artifacts needed to debug the failure. The rpmbase image
      # is still cached (only the final test container was `--rm`'d); when even the image
      # build failed that image is absent, hence the image-exists guard.
      - name: Extract dev RPMs
        if: always()
        run: |
          sudo podman image exists ai-tools-rpmbase:${{ matrix.tag }} || { echo "no image built; nothing to extract"; exit 0; }
          cid=$(sudo podman create ai-tools-rpmbase:${{ matrix.tag }})
          mkdir -p dist-rpms
          sudo podman cp "${cid}":/opt/ai-tools-src/packaging/rpmbuild/RPMS/noarch/. dist-rpms/
          sudo podman rm "${cid}" >/dev/null
          sudo chown -R "$(id -u):$(id -g)" dist-rpms

      - name: Upload dev RPM artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-tools-rpms-${{ matrix.tag }}-${{ steps.relver.outputs.release }}
          path: dist-rpms/*.rpm
          if-no-files-found: ignore
          retention-days: 14

  # Release tags publish. The channel follows the tag, never the branch: vX.Y.Z -> GitHub
  # Release + rpm.dagnode.com, vX.Y.Z-rc.N -> GitHub prerelease only, and an rc is the proof of a
  # pipeline change. Process contract: docs/development/release.md. Runs on a v*.*.* tag alone,
  # never on pull_request or workflow_dispatch, and reads its secrets from the `release`
  # environment, whose deployment policy admits such a tag and nothing else: a fork PR or a
  # branch run cannot reference the environment and so cannot see the signing key.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [shellcheck, typesafe-client, rpm-selftest]
    environment: release
    # Pinned like rpm-selftest: this job builds and signs RPMs inside podman containers,
    # so it needs the same known-good podman/crun combo (see that job's note).
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      # The dist tags this job builds, signs, and publishes, one per served distribution; each
      # names a `make rpmbase-<tag>` target and an rpm-selftest matrix arm, so a tag listed here
      # has passed the selftest on this commit before the release job starts. dag-node/rpm routes
      # each package into its served tree by this tag (.el9 -> el/9, .fc44 -> fedora/44).
      RPM_DIST_TAGS: el9 el10 fc44
    steps:
      # The write token is not stored in .git/config: no step of this job runs a git network command, and gh reads
      # its token from GH_TOKEN in the step that calls it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # check-version.sh relaxes the %changelog match for `-rc.N` tags; recovery for a mismatch
      # is fix VERSION/%changelog and re-tag.
      - name: Verify tag, VERSION, and %changelog agree
        run: bash packaging/check-version.sh "${GITHUB_REF_NAME}"

      # RC tags build with the Fedora prerelease Release 0.rcN (< the final "1", > the previous
      # release); final tags leave it empty. Allowlist: a dashed tag that is not vX.Y.Z-rc.N
      # fails here.
      - name: Classify the tag and compute RPM_RELEASE
        id: relmode
        run: |
          prerelease=false rpm_release=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.([0-9]+)$ ]] \
              || { echo "::error::prerelease tag ${GITHUB_REF_NAME} is not vX.Y.Z-rc.N"; exit 1; }
            prerelease=true rpm_release="0.rc${BASH_REMATCH[1]}"
          fi
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "rpm_release=${rpm_release}" >> "$GITHUB_OUTPUT"

      # Validate the release prerequisites BEFORE building or publishing anything, so a
      # misconfigured secret fails the job before any artifact ships -- rather than after the
      # GitHub Release is already public, where a hard failure only strands a half-published
      # release. Signing is MANDATORY: every published RPM must carry a verifiable dag-node
      # signature, so a missing or unusable secret fails the release here instead of shipping
      # unsigned. This step proves the key imports with a usable secret, is the org signing key,
      # and the dispatch token reaches dag-node/rpm; the passphrase and the full rpmsign+verify chain
      # are proven by the real in-container selftest, which also runs before anything is built or
      # published.
      - name: Preflight release prerequisites
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
          RPM_REPO_DISPATCH_TOKEN: ${{ secrets.RPM_REPO_DISPATCH_TOKEN }}
          # The org signing key, pinned by its PRIMARY fingerprint -- the one rpm.dagnode.com serves
          # and docs/rpm-packaging.md publishes. A subkey rotation keeps the primary, so this pin
          # survives one; a different primary is a different key, and a planned primary rotation
          # changes this line in the same reviewed change.
          ORG_SIGNING_PRIMARY_FPR: 67F42DC18BF764B42D82F14256D2F802CF9832E4
        run: |
          # Each message names the fix: the secret belongs to the `release` environment of this
          # repository, and the operator sets it with `gh secret set` (docs/development/release.md,
          # "Guardrails behind the process").
          [[ -n "${GPG_SIGNING_KEY}" ]] \
            || { echo "::error::GPG_SIGNING_KEY is empty: the release environment holds no secret of that name. Set the signing-subkey export: gh secret set GPG_SIGNING_KEY --env release -R ${GITHUB_REPOSITORY} < signing-subkey.asc"; exit 1; }
          [[ -n "${GPG_SIGNING_PASSPHRASE}" ]] \
            || { echo "::error::GPG_SIGNING_PASSPHRASE is empty: the release environment holds no secret of that name. Set the signing subkey's passphrase: gh secret set GPG_SIGNING_PASSPHRASE --env release -R ${GITHUB_REPOSITORY}"; exit 1; }
          [[ -n "${RPM_REPO_DISPATCH_TOKEN}" ]] \
            || { echo "::error::RPM_REPO_DISPATCH_TOKEN is empty: the release environment holds no secret of that name. Set a fine-grained token with contents: write on dag-node/rpm, which the publish to rpm.dagnode.com dispatches with: gh secret set RPM_REPO_DISPATCH_TOKEN --env release -R ${GITHUB_REPOSITORY}"; exit 1; }
          # The container stdin protocol reads the passphrase as the first line; a multi-line
          # value would silently truncate there and corrupt the key read that follows.
          [[ "${GPG_SIGNING_PASSPHRASE}" != *$'\n'* ]] \
            || { echo "::error::GPG_SIGNING_PASSPHRASE must be single-line"; exit 1; }

          # gpg must import into a keyring DIRECTORY to verify a usable secret key. Keep it on
          # tmpfs (/dev/shm, RAM) so the key never lands on persistent disk, and wipe on exit --
          # mirrors packaging/sign-rpms.sh. The key text arrives on stdin, never a temp file.
          gnupghome="$(mktemp -d -p /dev/shm 2>/dev/null || mktemp -d)"
          trap 'rm -rf "${gnupghome}"' EXIT
          printf '%s\n' "${GPG_SIGNING_KEY}" | GNUPGHOME="${gnupghome}" gpg --batch --quiet --import \
            || { echo "::error::GPG_SIGNING_KEY did not import: the value is not an ASCII-armored key block. Export the signing subkey with gpg --armor --export-secret-subkeys '<subkey-fpr>!' and set it again: gh secret set GPG_SIGNING_KEY --env release -R ${GITHUB_REPOSITORY} < signing-subkey.asc"; exit 1; }
          GNUPGHOME="${gnupghome}" gpg --batch --with-colons --list-secret-keys | grep -q '^sec:' \
            || { echo "::error::GPG_SIGNING_KEY carries no secret key: the value is a public key, or an export without the secret part. Export the signing subkey with gpg --armor --export-secret-subkeys '<subkey-fpr>!' and set it again: gh secret set GPG_SIGNING_KEY --env release -R ${GITHUB_REPOSITORY} < signing-subkey.asc"; exit 1; }

          # State the imported key's identity -- fingerprints are public, the served key file
          # carries them -- and refuse any key but the pinned one before a single RPM is signed
          # with it. Signed by another key, the RPMs would pass the runner's self-consistent
          # re-verify and publish, and dag-node/rpm would then drop them as not the org key's,
          # behind a tag that cannot move.
          have="$(GNUPGHOME="${gnupghome}" gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')"
          echo "imported signing key: primary ${have}"
          GNUPGHOME="${gnupghome}" gpg --batch --with-colons --list-keys "${have}" | awk -F: '$1=="sub"{s=1; next} $1=="fpr" && s {print "  subkey " $10; s=0}'
          [[ "${have}" == "${ORG_SIGNING_PRIMARY_FPR}" ]] \
            || { echo "::error::GPG_SIGNING_KEY is key ${have}, not the org signing key ${ORG_SIGNING_PRIMARY_FPR} whose public part rpm.dagnode.com serves. A different primary is a different key, not a rotation: set the export of the org key's signing subkey. A planned primary rotation changes ORG_SIGNING_PRIMARY_FPR in this workflow in the same change"; exit 1; }

          # Surface the HTTP status so an operator can tell a bad token (401) from a missing
          # grant/repo (403/404) at a glance -- gh prints "(HTTP NNN)" on stderr.
          if ! resp="$(GH_TOKEN="${RPM_REPO_DISPATCH_TOKEN}" gh api repos/dag-node/rpm --jq .full_name 2>&1)"; then
            echo "::error::RPM_REPO_DISPATCH_TOKEN cannot read dag-node/rpm: ${resp}. The token is invalid, expired, or lacks access. Create a fine-grained token with contents: write on dag-node/rpm and set it: gh secret set RPM_REPO_DISPATCH_TOKEN --env release -R ${GITHUB_REPOSITORY}"
            exit 1
          fi

      - name: Ensure podman + zip + rpm, force the modern runc runtime
        run: |
          # See the rpm-selftest job's note: the runner's podman defaults to an ancient crun that
          # rejects the generated OCI spec; force the modern runc via a containers.conf.d drop-in.
          sudo apt-get update
          sudo apt-get install -y zip rpm
          command -v podman >/dev/null || sudo apt-get install -y podman
          sudo mkdir -p /etc/containers/containers.conf.d
          printf '[engine]\nruntime = "runc"\n' | sudo tee /etc/containers/containers.conf.d/10-runc.conf
          sudo podman version || true
          sudo podman info --format 'runtime={{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Version}}' 2>/dev/null || true

      # Build each distribution's image once, up front. Both the signing selftest and the
      # release-RPM extraction reuse these cached images, so each image is built once.
      # rpmbase-<tag>, not rpmtest-<distro>: the `needs: rpm-selftest` dependency already ran and
      # passed the full selftest on this exact commit.
      - name: Build the RPM images
        run: |
          for tag in ${RPM_DIST_TAGS}; do
            make -C packaging rpmbase-${tag} OCI="sudo podman" RPM_RELEASE="${{ steps.relmode.outputs.rpm_release }}"
          done

      # Prove the ENTIRE signing chain -- key, passphrase, rpmsign, and signature verification --
      # on a throwaway RPM inside each distribution's container, BEFORE any release RPM is built or
      # published. A wrong passphrase or a container where rpmsign silently no-ops (the 0.6.1
      # failure mode) fails the job here. The signing key is a step-scoped env var, never baked
      # into an image layer or build cache.
      # `--entrypoint` bypasses the image's /sbin/init (a bare command is ignored init arguments --
      # the container would boot the selftest instead); the assertion proves sign-rpms.sh ran.
      - name: Prove the signing chain end-to-end (in-container)
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Secrets travel over stdin (printf is a builtin -- no argv exposure), never the
          # container environment: podman records `-e` values in the on-disk container config.
          for tag in ${RPM_DIST_TAGS}; do
            out="$(printf '%s\n%s\n' "${GPG_SIGNING_PASSPHRASE}" "${GPG_SIGNING_KEY}" \
              | sudo podman run --rm -i \
              --entrypoint /usr/bin/bash \
              ai-tools-rpmbase:${tag} \
              /opt/ai-tools-src/packaging/sign-rpms.sh --secrets-stdin --selftest)"
            printf '%s\n' "${out}"
            grep -q -- '--selftest OK' <<<"${out}" \
              || { echo "::error::${tag}: sign-rpms.sh --selftest did not run -- its success line is absent"; exit 1; }
          done

      # Sign the RPMs the image built INSIDE the distribution's own container, so the rpm/gnupg
      # toolchain that signs matches the one that built them (see packaging/sign-rpms.sh), then copy
      # the SIGNED RPMs out with `podman cp`. `--entrypoint` overrides the image's /sbin/init -- a
      # bare command is ignored init arguments, and the container would boot the selftest and power
      # off "successfully" without signing. The success-line assertion pins the workload; the runner
      # re-verify in the next step is the fail-closed backstop. sign-rpms.sh writes its own verify
      # public key to a container-local path; the PUBLISHED key is exported on the runner.
      - name: Sign and extract release RPMs (in-container)
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          rpmdir=/opt/ai-tools-src/packaging/rpmbuild/RPMS/noarch
          for tag in ${RPM_DIST_TAGS}; do
            mkdir -p "dist-rpms/${tag}"
            cname="ai-tools-sign-${tag}"
            out="$(printf '%s\n%s\n' "${GPG_SIGNING_PASSPHRASE}" "${GPG_SIGNING_KEY}" \
              | sudo podman run -i --name "${cname}" \
              --entrypoint /usr/bin/bash \
              ai-tools-rpmbase:${tag} -c '
                bash /opt/ai-tools-src/packaging/sign-rpms.sh --secrets-stdin /tmp/pubkey.asc \
                  /opt/ai-tools-src/packaging/rpmbuild/RPMS/noarch/*.rpm
              ')"
            printf '%s\n' "${out}"
            grep -q 'signed and verified' <<<"${out}" \
              || { echo "::error::${tag}: sign-rpms.sh did not run in the sign container"; exit 1; }
            sudo podman cp "${cname}:${rpmdir}/." "dist-rpms/${tag}/"
            sudo podman rm "${cname}" >/dev/null
          done
          sudo chown -R "$(id -u):$(id -g)" dist-rpms

      # Export the published public key on the runner, straight from the signing secret, and
      # verify every RPM against it here -- rather than trusting a file the container wrote into
      # the bind mount to surface on the runner (the v0.6.2 failure: the container-written key was
      # absent at release time). The key is public; the private key is imported into a tmpfs
      # (/dev/shm, RAM) keyring wiped on exit, never persistent disk. If the in-container signing
      # did not actually reach the runner filesystem, the re-verify fails closed instead
      # of publishing unsigned packages.
      - name: Export the public key and verify signatures on the runner
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          gnupghome="$(mktemp -d -p /dev/shm 2>/dev/null || mktemp -d)"
          trap 'rm -rf "${gnupghome}"' EXIT
          printf '%s\n' "${GPG_SIGNING_KEY}" | GNUPGHOME="${gnupghome}" gpg --batch --quiet --import
          fpr="$(GNUPGHOME="${gnupghome}" gpg --batch --with-colons --list-secret-keys \
                  | awk -F: '$1 == "fpr" { print $10; exit }')"
          [[ -n "${fpr}" ]] || { echo "::error::no secret key after import"; exit 1; }
          GNUPGHOME="${gnupghome}" gpg --batch --armor --export "${fpr}" > dist-rpms/RPM-GPG-KEY-dag-node
          [[ -s dist-rpms/RPM-GPG-KEY-dag-node ]] || { echo "::error::exported public key is empty"; exit 1; }

          # Verify against a throwaway rpmdb seeded only with the exported key. Require a validating
          # signature LINE (`rpmkeys -Kv`), not just a zero exit -- an unsigned package exits 0.
          verifydb="$(mktemp -d)"
          rpmkeys --dbpath "${verifydb}" --import dist-rpms/RPM-GPG-KEY-dag-node
          for tag in ${RPM_DIST_TAGS}; do
            # The per-tag glob must match: a tag whose sign step produced no file is a release
            # with a distribution missing, and the inner loop would pass it by in silence.
            compgen -G "dist-rpms/${tag}/*.rpm" >/dev/null \
              || { echo "::error::no RPMs under dist-rpms/${tag} -- the ${tag} sign step produced none"; exit 1; }
            for rpm in dist-rpms/"${tag}"/*.rpm; do
              rpmkeys --dbpath "${verifydb}" -Kv "${rpm}" 2>&1 \
                | grep -Eqi 'signature.*:[[:space:]]*OK[[:space:]]*$' \
                || { echo "::error::${rpm} is not signed on the runner -- the in-container signing did not persist to the host"; exit 1; }
            done
          done
          echo "verified $(find dist-rpms -name '*.rpm' | wc -l) signed RPM(s) on the runner"

      # Every distribution's RPMs land as flat, same-named-prefix assets on one release page
      # (see the upload step); a per-distribution zip removes the "which files go together"
      # ambiguity that creates -- `dnf install ./*.rpm` after unzipping is then unambiguous
      # by construction, since each archive holds exactly one distribution's packages. The
      # runner-exported public key (dist-rpms/RPM-GPG-KEY-dag-node) rides inside each zip too, so an
      # operator imports it and installs from one archive offline; rpm.dagnode.com serves it too.
      - name: Bundle per-distribution zip archives
        run: |
          for tag in ${RPM_DIST_TAGS}; do
            (cd "dist-rpms/${tag}" && zip -j "../ai-tools-${tag}-${GITHUB_REF_NAME}.zip" ./*.rpm ../RPM-GPG-KEY-dag-node)
          done

      # Uploaded before the publish steps, so a failed publish still leaves the verified RPMs
      # downloadable.
      - name: Upload signed RPMs as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-tools-signed-rpms
          path: dist-rpms/
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.relmode.outputs.prerelease }}
        run: |
          # Attach the runner-exported public key too, so a manual download can verify without
          # reaching rpm.dagnode.com. It was produced + checked in the verify step.
          assets=(dist-rpms/RPM-GPG-KEY-dag-node)
          for tag in ${RPM_DIST_TAGS}; do
            assets+=("dist-rpms/ai-tools-${tag}-${GITHUB_REF_NAME}.zip" dist-rpms/"${tag}"/*.rpm)
          done
          # Idempotent: if a later step (e.g. the publish-notify) failed and this workflow is
          # re-run, creating the release again would fail on the already-present tag. Refresh the
          # existing release's assets instead, so re-running the workflow recovers on its own
          # rather than needing a hand-built release.
          flags=(--title "${GITHUB_REF_NAME}" --generate-notes --verify-tag)
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload --clobber "${GITHUB_REF_NAME}" "${assets[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" "${flags[@]}" "${assets[@]}"
          fi

      # Notify the central dag-node/rpm repository to rebuild and publish the signed DNF repo at
      # rpm.dagnode.com from this release. That repo owns the single publish pipeline (createrepo_c
      # + repomd.xml signing + GitHub Pages deploy) and serializes concurrent project releases, so
      # this project never writes the repo directly -- it triggers the pipeline via repository_dispatch
      # (a workflow_call reusable workflow cannot own another repo's Pages deploy: it runs in the
      # caller's context). The token (a fine-grained PAT/App token with contents:write on
      # dag-node/rpm, a secret of the release environment) is required and already vetted in
      # preflight, so this step only handles a transient dispatch failure.
      # Final tags only: dag-node/rpm serves ^vX.Y.Z$ tags, so notifying on an `-rc` tag would
      # rebuild the repo just to drop the RC. RCs ship as GitHub prerelease assets.
      - name: Notify central RPM repository (rpm.dagnode.com)
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.RPM_REPO_DISPATCH_TOKEN }}
        run: |
          # Preflight already vetted the token, so a failure here is transient (a registry blip on
          # dag-node/rpm's side). Retry with backoff rather than degrading to a hand-built dispatch.
          # If it still fails, fail the job: the release is idempotent (see Create GitHub Release),
          # so re-running this workflow re-fires the notify and completes the publish -- no manual
          # step.
          attempts=5
          for attempt in $(seq 1 "${attempts}"); do
            if gh api "repos/dag-node/rpm/dispatches" \
                  -f "event_type=publish-rpm" \
                  -F "client_payload[project]=${GITHUB_REPOSITORY}" \
                  -F "client_payload[tag]=${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if [[ "${attempt}" -lt "${attempts}" ]]; then
              echo "publish-notify attempt ${attempt}/${attempts} failed; retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
            fi
          done
          echo "::error::publish-notify to dag-node/rpm failed after ${attempts} attempts -- re-run this workflow to retry (the release is idempotent, so nothing is duplicated)." >&2
          exit 1
